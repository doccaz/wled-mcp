services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./dev/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Logs every MQTT message so you can watch WLED commands as they fire.
  sniffer:
    image: eclipse-mosquitto:2
    depends_on:
      mosquitto:
        condition: service_healthy
    command: mosquitto_sub -h mosquitto -t "#" -v
    restart: on-failure

  wled-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      WLED_MCP_CONFIG: /etc/wled-mcp/config.yaml
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8080"
      LOG_LEVEL: DEBUG
    volumes:
      - ./dev/config.yaml:/etc/wled-mcp/config.yaml:ro
    depends_on:
      mosquitto:
        condition: service_healthy
