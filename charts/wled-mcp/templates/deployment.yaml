apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wled-mcp.fullname" . }}
  labels: {{- include "wled-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "wled-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wled-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        # Roll the pod when config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        seccompProfile: {{- toYaml .Values.securityContext.seccompProfile | nindent 10 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities: {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: WLED_MCP_CONFIG
              value: /etc/wled-mcp/config.yaml
            - name: MCP_HTTP_HOST
              value: "0.0.0.0"
            - name: MCP_HTTP_PORT
              value: {{ .Values.service.targetPort | quote }}
            {{- $secret := include "wled-mcp.mqttSecretName" . }}
            {{- if $secret }}
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: username
                  optional: true
            - name: MQTT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: password
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/wled-mcp
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "wled-mcp.fullname" . }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
